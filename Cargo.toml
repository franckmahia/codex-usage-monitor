[package]
name = "codex-meter"
version = "0.1.0"
edition = "2021"
description = "Local, auditable Codex token usage meter. Read-only, offline."
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "8"
csv = "1"
dirs = "6"

[profile.release]
lto = true
