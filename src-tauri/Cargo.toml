[package]
name = "codex-meter-ui"
version = "0.1.0"
edition = "2021"
description = "Codex Usage Monitor - dashboard Tauri"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
codex-meter = { path = ".." }

[lib]
name = "codex_meter_ui"
crate-type = ["staticlib", "cdylib", "rlib"]
